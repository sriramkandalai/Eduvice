<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eduvice — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffd010;
      --blue: #2350b5;
      --blue-dark: #1a3d8f;
      --cream: #fff4dc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: "Poppins", system-ui, sans-serif;
    }

    /* ---------- Animated background of university names ---------- */
    .bg {
      position: fixed;
      inset: -20%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.1rem;
      transform: rotate(-8deg);
      pointer-events: none;
      transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
    }

    .row {
      display: flex;
      width: max-content;
      white-space: nowrap;
      animation: scroll var(--speed, 60s) linear infinite;
      animation-direction: var(--dir, normal);
      will-change: transform;
    }

    .row span {
      font-family: "Poppins", sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0 1.4rem;
      font-size: var(--size, 2.4rem);
      color: rgba(35, 80, 181, 0.13);
    }

    .row.outline span {
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(35, 80, 181, 0.22);
    }

    .row span::after {
      content: "•";
      margin-left: 2.8rem;
      color: rgba(255, 255, 255, 0.55);
      -webkit-text-stroke: 0;
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* Soft glow behind the logo so it reads cleanly over the names */
    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 55% 50% at 50% 50%,
        rgba(255, 208, 16, 0.97) 0%,
        rgba(255, 208, 16, 0.85) 40%,
        rgba(255, 208, 16, 0) 75%);
    }

    /* ---------- Hero ---------- */
    main {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      text-align: center;
      padding: 1rem;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
    }

    /* Graduation cap */
    .cap-wrap {
      width: min(280px, 60vw);
      animation: capDrop 1.1s cubic-bezier(.34,1.56,.64,1) both;
    }
    .cap {
      width: 100%;
      display: block;
      animation: float 4.5s ease-in-out 1.1s infinite;
      filter: drop-shadow(0 14px 18px rgba(26, 61, 143, 0.25));
    }
    .tassel {
      transform-origin: 206px 52px;
      animation: sway 3s ease-in-out infinite;
    }

    @keyframes capDrop {
      0%   { opacity: 0; transform: translateY(-120px) rotate(-14deg); }
      100% { opacity: 1; transform: translateY(0) rotate(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-1.5deg); }
      50%      { transform: translateY(-10px) rotate(1.5deg); }
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-7deg); }
      50%      { transform: rotate(7deg); }
    }

    /* EDUVICE wordmark */
    .wordmark {
      display: flex;
      font-family: "Luckiest Guy", "Poppins", sans-serif;
      font-size: clamp(3.4rem, 13vw, 8.5rem);
      line-height: 1;
      margin-top: -0.4rem;
    }
    .wordmark .arch {
      display: inline-block;
      transform: translateY(var(--y)) rotate(var(--r));
    }
    .wordmark .ch {
      display: inline-block;
      color: var(--blue);
      -webkit-text-stroke: 0.09em var(--cream);
      paint-order: stroke fill;
      text-shadow: 0.05em 0.06em 0 rgba(26, 61, 143, 0.28);
      animation:
        pop 0.7s cubic-bezier(.34,1.56,.64,1) both,
        wave 3.2s ease-in-out infinite;
      animation-delay: var(--d), calc(var(--d) + 1.4s);
    }

    @keyframes pop {
      0%   { opacity: 0; transform: translateY(40px) scale(0.4); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes wave {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-0.12em); }
    }

    /* Coming soon badge */
    .soon {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: 0.9rem;
      margin-top: 1.6rem;
      padding: 0.9rem 2.1rem;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: clamp(0.95rem, 2.6vw, 1.3rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      box-shadow:
        0 0 0 6px rgba(255, 255, 255, 0.35),
        0 18px 40px -10px rgba(26, 61, 143, 0.55);
      animation: rise 0.9s cubic-bezier(.2,.8,.2,1) 1.5s both;
    }
    .soon .label { padding-left: 0.42em; } /* balance trailing letter-spacing */

    .soon::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 40%;
      left: -60%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,0.35), transparent);
      transform: skewX(-20deg);
      animation: shine 3.6s ease-in-out 2.6s infinite;
    }

    .pulse {
      position: relative;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--bg);
      flex: none;
    }
    .pulse::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--bg);
      animation: ping 1.8s cubic-bezier(0,0,.2,1) infinite;
    }

    .dots span {
      display: inline-block;
      animation: blink 1.4s infinite both;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes rise {
      0%   { opacity: 0; transform: translateY(30px) scale(0.92); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes shine {
      0%, 55% { left: -60%; }
      100%    { left: 130%; }
    }
    @keyframes ping {
      75%, 100% { transform: scale(2.6); opacity: 0; }
    }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40%           { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <main>
    <div class="hero" id="hero">
      <div class="cap-wrap">
        <svg class="cap" viewBox="0 0 240 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Graduation cap">
          <!-- cap base -->
          <path d="M58 62 L58 104 Q120 132 182 104 L182 62 Z" fill="#1a3d8f" />
          <path d="M58 98 Q120 124 182 98" fill="none" stroke="#fff4dc" stroke-width="4" stroke-linecap="round" opacity="0.9" />
          <!-- board -->
          <polygon points="120,8 232,46 120,84 8,46" fill="#2350b5" />
          <polygon points="120,8 232,46 120,84 8,46" fill="none" stroke="#fff4dc" stroke-width="3" stroke-linejoin="round" opacity="0.55" />
          <polygon points="120,8 232,46 120,30 8,46" fill="#3a68cf" opacity="0.55" />
          <!-- button -->
          <ellipse cx="120" cy="46" rx="7" ry="4" fill="#1a3d8f" />
          <!-- tassel -->
          <path d="M120 46 Q170 44 206 52" fill="none" stroke="#1a3d8f" stroke-width="3.5" stroke-linecap="round" />
          <g class="tassel">
            <line x1="206" y1="52" x2="206" y2="104" stroke="#1a3d8f" stroke-width="3.5" stroke-linecap="round" />
            <path d="M200 104 L212 104 L215 128 L197 128 Z" fill="#1a3d8f" />
            <rect x="199" y="100" width="14" height="6" rx="2" fill="#2350b5" />
          </g>
        </svg>
      </div>

      <h1 class="wordmark" id="wordmark" aria-label="Eduvice"></h1>
    </div>

    <div class="soon" role="status">
      <span class="pulse"></span>
      <span class="label">Coming Soon<span class="dots"><span>.</span><span>.</span><span>.</span></span></span>
    </div>
  </main>

  <script>
    // Wordmark: letters sit on a gentle arch, pop in one by one, then wave
    const word = "EDUVICE";
    const mark = document.getElementById("wordmark");
    const mid = (word.length - 1) / 2;
    [...word].forEach((c, i) => {
      const off = i - mid;
      const arch = document.createElement("span");
      arch.className = "arch";
      arch.style.setProperty("--y", `${off * off * 0.018}em`);
      arch.style.setProperty("--r", `${off * 3.2}deg`);
      arch.setAttribute("aria-hidden", "true");
      const ch = document.createElement("span");
      ch.className = "ch";
      ch.textContent = c;
      ch.style.setProperty("--d", `${0.55 + i * 0.09}s`);
      arch.appendChild(ch);
      mark.appendChild(arch);
    });

    // Background: big and small U.S. universities scrolling in alternating rows
    const universities = [
      "Harvard University", "Stanford University", "MIT", "Yale University", "Princeton University",
      "Columbia University", "University of Chicago", "Duke University", "Caltech", "Johns Hopkins University",
      "Northwestern University", "Brown University", "Cornell University", "Dartmouth College", "Rice University",
      "Vanderbilt University", "UC Berkeley", "UCLA", "University of Michigan", "University of Texas at Austin",
      "Georgia Tech", "University of Virginia", "UNC Chapel Hill", "Carnegie Mellon University", "NYU",
      "University of Florida", "Ohio State University", "Penn State", "Purdue University", "University of Washington",
      "University of Wisconsin", "Texas A&M University", "Arizona State University", "University of Southern California", "Boston University",
      "Emory University", "Notre Dame", "Georgetown University", "Tufts University", "Wake Forest University",
      "Williams College", "Amherst College", "Swarthmore College", "Pomona College", "Bowdoin College",
      "Middlebury College", "Carleton College", "Davidson College", "Colby College", "Hamilton College",
      "Grinnell College", "Oberlin College", "Reed College", "Kenyon College", "Bates College",
      "Harvey Mudd College", "Vassar College", "Wellesley College", "Smith College", "Haverford College",
      "Colgate University", "Bucknell University", "Lehigh University", "Villanova University", "Gonzaga University",
      "Baylor University", "Clemson University", "Auburn University", "University of Alabama", "University of Oregon",
      "University of Utah", "University of Colorado Boulder", "University of Iowa", "Iowa State University", "Kansas State University",
      "University of Nebraska", "Rutgers University", "University of Maryland", "Virginia Tech", "University of Georgia",
      "Howard University", "Spelman College", "Morehouse College", "Tuskegee University", "Xavier University",
      "Berea College", "Deep Springs College", "Whitman College", "St. Olaf College", "Macalester College",
      "Furman University", "Rhodes College", "Trinity University", "Santa Clara University", "Pepperdine University",
      "Creighton University", "Drake University", "Butler University", "Elon University", "Marquette University",
      "University of Hawaii", "University of Alaska", "University of Vermont", "University of Maine", "University of Montana",
      "Montana State University", "Boise State University", "University of Wyoming", "New Mexico State", "UT Dallas",
      "Collin College", "Southern Methodist University", "TCU", "Texas Tech University", "University of Houston"
    ];

    const shuffle = (a) => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
    const bg = document.getElementById("bg");
    const rowCount = 14;
    const perRow = Math.ceil(universities.length / rowCount) + 6;
    const sizes = ["1.6rem", "2.6rem", "2rem", "3.2rem", "1.8rem", "2.4rem"];

    for (let r = 0; r < rowCount; r++) {
      const row = document.createElement("div");
      row.className = "row" + (r % 3 === 1 ? " outline" : "");
      row.style.setProperty("--speed", `${70 + (r % 4) * 18}s`);
      row.style.setProperty("--dir", r % 2 ? "reverse" : "normal");
      row.style.setProperty("--size", sizes[r % sizes.length]);

      const names = shuffle(universities).slice(0, perRow);
      // duplicate the set so the -50% translate loops seamlessly
      [...names, ...names].forEach(n => {
        const s = document.createElement("span");
        s.textContent = n;
        row.appendChild(s);
      });
      bg.appendChild(row);
    }

    // Subtle parallax on mouse move for a smooth, layered feel
    const hero = document.getElementById("hero");
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      window.addEventListener("pointermove", (e) => {
        const x = e.clientX / innerWidth - 0.5;
        const y = e.clientY / innerHeight - 0.5;
        bg.style.transform = `rotate(-8deg) translate(${x * -24}px, ${y * -24}px)`;
        hero.style.transform = `translate(${x * 12}px, ${y * 12}px)`;
      });
    }
  </script>
</body>
</html>
