<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" stroke="#2350b5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.13" stroke-width="3">
  <!-- EduVice background tile: school doodles along a winding dotted path ("marg" = path).
       Tiles seamlessly: the path leaves the right edge at the same height it enters on the left. -->

  <!-- the path -->
  <path d="M0 250 C 50 250, 60 190, 110 196 S 170 262, 222 236 S 280 160, 320 250" stroke-dasharray="1 11" stroke-width="5"/>
  <path d="M0 90 C 40 70, 70 120, 120 104 S 200 40, 250 70 S 300 110, 320 90" stroke-dasharray="1 11" stroke-width="5"/>

  <!-- pencil -->
  <g transform="translate(36 22) rotate(35)">
    <rect x="0" y="0" width="12" height="44" rx="2"/>
    <path d="M0 44 L6 58 L12 44"/>
    <path d="M0 8 H12"/>
  </g>

  <!-- open book -->
  <g transform="translate(176 120)">
    <path d="M0 6 C 12 0, 24 0, 34 6 V 40 C 24 34, 12 34, 0 40 Z"/>
    <path d="M34 6 C 44 0, 56 0, 68 6 V 40 C 56 34, 44 34, 34 40"/>
  </g>

  <!-- star -->
  <path transform="translate(262 18)" d="M14 0 L18 10 L28 10 L20 17 L23 28 L14 21 L5 28 L8 17 L0 10 L10 10 Z"/>

  <!-- graduation cap -->
  <g transform="translate(58 140)">
    <path d="M0 10 L22 0 L44 10 L22 20 Z"/>
    <path d="M10 15 V 25 C 16 30, 28 30, 34 25 V 15"/>
    <path d="M44 10 V 22"/>
  </g>

  <!-- lightbulb -->
  <g transform="translate(270 190)">
    <path d="M12 0 C 22 0, 26 8, 24 15 C 22 21, 17 22, 17 28 H 7 C 7 22, 2 21, 0 15 C -2 8, 2 0, 12 0 Z"/>
    <path d="M8 33 H16"/>
  </g>

  <!-- ruler -->
  <g transform="translate(124 266) rotate(-12)">
    <rect x="0" y="0" width="54" height="14" rx="2"/>
    <path d="M10 0 V6 M20 0 V8 M30 0 V6 M40 0 V8"/>
  </g>

  <!-- A+ -->
  <g transform="translate(150 20)">
    <path d="M0 30 L11 0 L22 30 M5 18 H17"/>
    <path d="M30 15 H44 M37 8 V22"/>
  </g>

  <!-- little dots -->
  <circle cx="20" cy="190" r="2.5"/>
  <circle cx="230" cy="300" r="2.5"/>
  <circle cx="300" cy="140" r="2.5"/>
</svg>
